name: CI - Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_NAME: OutSystems.TimeZoneToolkit
  TESTS_PROJECT: OutSystems.TimeZoneToolkit.UnitTests
  PRODUCT_NAME: TimeZoneToolkit

jobs:
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_NAME }}.slnx -r linux-x64 --locked-mode

    # Scans the whole solution: the test project's packages execute during the
    # build, so leaving them unscanned is the widest hole in a build-time audit.
    - name: Audit dependencies (fail on any vulnerability, transitive included)
      run: |
        set -o pipefail
        dotnet list ${{ env.PROJECT_NAME }}.slnx package --vulnerable --include-transitive 2>&1 | tee audit.log
        if grep -E '^\s+>' audit.log; then
          echo "::error::Vulnerable packages detected"
          exit 1
        fi

    - name: Run Tests
      run: |
        dotnet test ${{ env.TESTS_PROJECT }}/${{ env.TESTS_PROJECT }}.csproj \
        --configuration Release \
        --no-restore \
        --nologo \
        --collect:"XPlat Code Coverage" \
        --results-directory ./coverage

    - name: Report Code Coverage
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        fail_below_min: false
        format: markdown
        output: both

    - name: Write Summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY
