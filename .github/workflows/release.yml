name: Build and Package Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

env:
  PROJECT_NAME: OutSystems.TimeZoneToolkit
  TESTS_PROJECT: OutSystems.TimeZoneToolkit.UnitTests
  PRODUCT_NAME: TimeZoneToolkit

jobs:
  # Everything that runs untrusted code — the test host, MSBuild targets from
  # restored packages, third-party actions, the CycloneDX tool — happens here,
  # with read-only permissions and no signing identity in the environment.
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      zip: ${{ steps.zip.outputs.ZIP }}

    steps:
    - name: Checkout Code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Verify the tag is on main
      run: |
        git fetch --no-tags origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag $GITHUB_REF_NAME points at $GITHUB_SHA, which is not an ancestor of main. Refusing to release unreviewed code."
          exit 1
        fi

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore ${{ env.PROJECT_NAME }}.slnx -r linux-x64 --locked-mode

    # Scans the whole solution, so the test project's dependency graph is
    # covered too — those packages execute during the build.
    - name: Audit dependencies (fail on any vulnerability, transitive included)
      run: |
        set -o pipefail
        dotnet list ${{ env.PROJECT_NAME }}.slnx package --vulnerable --include-transitive 2>&1 | tee audit.log
        if grep -E '^\s+>' audit.log; then
          echo "::error::Vulnerable packages detected"
          exit 1
        fi

    # --- THE GATEKEEPER: RUN TESTS ---

    - name: Run Tests
      run: |
        dotnet test ${{ env.TESTS_PROJECT }}/${{ env.TESTS_PROJECT }}.csproj \
        --configuration Release \
        --no-restore \
        --nologo \
        --collect:"XPlat Code Coverage" \
        --results-directory ./coverage

    - name: Report Code Coverage
      uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
      with:
        filename: coverage/**/coverage.cobertura.xml
        badge: true
        format: markdown
        output: both

    - name: Write Summary
      run: cat code-coverage-results.md >> $GITHUB_STEP_SUMMARY

    # --- PACKAGING STEPS (Only runs if tests pass) ---

    - name: Get Version from Tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Publish App
      run: |
        dotnet publish ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj \
        -c Release \
        -r linux-x64 \
        --self-contained false \
        --no-restore \
        -o ./publish

    - name: Include license and attribution in the package
      run: cp LICENSE NOTICE ./publish/

    - name: Create Versioned Zip
      id: zip
      run: |
        cd ./publish
        zip -r ../${{ env.PRODUCT_NAME }}_${{ steps.get_version.outputs.VERSION }}.zip .
        cd ..
        echo "ZIP=${{ env.PRODUCT_NAME }}_${{ steps.get_version.outputs.VERSION }}.zip" >> $GITHUB_OUTPUT

    - name: Generate SHA-256 checksum
      run: |
        sha256sum ${{ steps.zip.outputs.ZIP }} > ${{ steps.zip.outputs.ZIP }}.sha256
        cat ${{ steps.zip.outputs.ZIP }}.sha256

    - name: Generate SBOM (CycloneDX)
      run: |
        dotnet tool install --global CycloneDX --version 6.2.0
        dotnet CycloneDX ${{ env.PROJECT_NAME }}/${{ env.PROJECT_NAME }}.csproj \
          --output ./sbom \
          --filename ${{ env.PRODUCT_NAME }}_${{ steps.get_version.outputs.VERSION }}.sbom.json \
          --output-format Json

    - name: Upload release candidate
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: release-candidate
        path: |
          ${{ steps.zip.outputs.ZIP }}
          ${{ steps.zip.outputs.ZIP }}.sha256
          ./sbom/${{ env.PRODUCT_NAME }}_${{ steps.get_version.outputs.VERSION }}.sbom.json
        if-no-files-found: error
        retention-days: 7

  # Holds the signing identity. Runs no project code — it only downloads what
  # the build job produced, attests it, and publishes.
  publish:
    name: Attest and Publish
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
    - name: Download release candidate
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        name: release-candidate
        path: ./artifacts

    - name: Flatten artifact layout
      run: |
        find ./artifacts -mindepth 2 -type f -exec mv -t ./artifacts {} +
        find ./artifacts -mindepth 1 -type d -empty -delete
        ls -la ./artifacts

    - name: Verify checksum survived transfer
      working-directory: ./artifacts
      run: sha256sum -c ${{ needs.build.outputs.zip }}.sha256

    # Every published file is attested, not just the ZIP. Attesting the ZIP
    # alone leaves the checksum and SBOM replaceable by anyone with write access.
    - name: Attest build provenance
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
      with:
        subject-path: |
          ./artifacts/${{ needs.build.outputs.zip }}
          ./artifacts/${{ needs.build.outputs.zip }}.sha256
          ./artifacts/${{ env.PRODUCT_NAME }}_${{ needs.build.outputs.version }}.sbom.json

    - name: Create GitHub Release
      uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
      with:
        files: |
          ./artifacts/${{ needs.build.outputs.zip }}
          ./artifacts/${{ needs.build.outputs.zip }}.sha256
          ./artifacts/${{ env.PRODUCT_NAME }}_${{ needs.build.outputs.version }}.sbom.json
        name: Release ${{ needs.build.outputs.version }}
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
